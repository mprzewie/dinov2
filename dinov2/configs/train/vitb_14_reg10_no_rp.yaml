# this corresponds to the default config
train:
#  dataset_path: ImageNet:split=TRAIN:root=~/data/Imagenette:extra=~/data/Imagenette/dinov2_metadata
  # dataset_path: ImageFolder:root=~/data/Imagenette/train
  dataset_path: ImageFolder:root=~/storage/datasets/ImageNette/train
  batch_size_per_gpu: 256
  num_workers: 16
  OFFICIAL_EPOCH_LENGTH: 12
  centering: sinkhorn_knopp
optim:
  epochs: 500
  weight_decay_end: 0.2
  base_lr: 2.0e-04  # learning rate for a batch size of 1024
  warmup_epochs: 80
  layerwise_decay: 1.0
crops:
  local_crops_size: 98
student:
  block_chunks: 4
#  arch: vit_small_attn
  arch: vit_base
  num_register_tokens: 10
  register_prompt_size: 0
  patch_size: 14
  drop_path_rate: 0.4
  ffn_layer: swiglufused
teacher:
  momentum_teacher: 0.994
dino:
  head_n_prototypes: 131072
  head_bottleneck_dim: 384
ibot:
  separate_head: true
  head_n_prototypes: 131072